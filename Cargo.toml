[package]
name = "spatie-image-optimizer"
version = "1.0.1"
edition = "2024"
rust-version = "1.89"
authors = ["Spatie <info@spatie.be>"]
description = "Optimize images with a configurable chain of native tools"
license = "MIT"
repository = "https://github.com/spatie/image-optimizer-rust"
documentation = "https://docs.rs/spatie-image-optimizer"
readme = "README.md"
keywords = ["image", "optimization", "compression"]
categories = ["multimedia::images"]
include = ["/src/", "/tests/", "/build.rs", "/docs/", "/README.md", "/LICENSE.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/PARITY.md", "/Cargo.lock"]

[dependencies]
file-format = { version = "0.29", features = ["reader-txt", "reader-xml"] }
same-file = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
url = "2"
wait-timeout = "0.2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[profile.release]
lto = "thin"
strip = true
